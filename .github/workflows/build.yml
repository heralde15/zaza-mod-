name: Build Terraria Unified zMod

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\Terraria-ZazaMod.csproj

      - name: Build Release
        run: dotnet build .\Terraria-zMod.csproj -c Release --no-restore -v:minimal

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Terraria-zMod-build
          path: |
            bin/Release/net8.0/**
            !bin/Release/net8.0/**/*.pdb
          if-no-files-found: error
          retention-days: 14
