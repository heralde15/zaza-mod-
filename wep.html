<html lang="es">
<head>

    <title>Dashboard de Discord</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2C3E50;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #34495E;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ECF0F1;
        }
        p {
            color: #BDC3C7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenido al Dashboard de Discord</h1>
        <p>Aquí puedes ver información sobre tu servidor.</p>
        <ul>
            <li>Cantidad de miembros: 50</li>
            <li>Canal principal: General</li>
            <li>Días desde la creación: 3 meses</li>
        </ul>
    </div>

    </script>
</body>
</html>
